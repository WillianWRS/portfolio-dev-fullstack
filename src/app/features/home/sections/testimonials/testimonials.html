<section id="testimonials" class="section-reveal mt-28 md:mt-36 scroll-mt-28">
  <div class="section-card">
    <h2 class="section-card__heading">
      <app-icon name="quote" />
      {{ localeService.t('testimonials.heading') }}
    </h2>
    <p class="section-card__subtitle">{{ localeService.t('testimonials.subtitle') }}</p>

    <div class="testimonials-grid mt-14">
      @for (item of content.testimonials(); track item.id) {
        <figure
          class="testimonial-card"
          [class.testimonial-card--placeholder]="item.isPlaceholder"
        >
          <figcaption class="testimonial-card__header">
            @if (item.isPlaceholder) {
              <span class="testimonial-card__avatar testimonial-card__avatar--placeholder" aria-hidden="true"></span>
            } @else {
              <img
                class="testimonial-card__avatar"
                [src]="item.avatarUrl"
                [alt]="item.author"
                width="48"
                height="48"
                loading="lazy"
              />
            }
            <div class="testimonial-card__identity">
              <span class="testimonial-card__name">{{ item.author }}</span>
              <span class="testimonial-card__role">{{ item.role }}</span>
            </div>
          </figcaption>

          <p class="testimonial-card__context">{{ item.context }}</p>

          <blockquote class="testimonial-card__quote">
            <p>{{ item.quote }}</p>
          </blockquote>

          @if (!item.isPlaceholder) {
            <a
              class="testimonial-card__source"
              [href]="item.sourceUrl"
              target="_blank"
              rel="noopener noreferrer"
            >
              <app-icon name="linkedin" size="sm" />
              <span>{{ localeService.t('testimonials.sourceLinkedIn') }}</span>
            </a>
          }
        </figure>
      }
    </div>
  </div>
</section>
