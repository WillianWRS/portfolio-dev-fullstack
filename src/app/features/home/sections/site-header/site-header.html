<header class="site-header">
  <div class="site-header__toolbar">
    <a routerLink="/" class="site-brand" aria-label="WRS — início">
      <img
        src="/wrs.png"
        alt=""
        class="site-brand__img"
        width="68"
        height="68"
        decoding="async"
      />
    </a>

    <nav
      class="site-nav hidden items-center gap-1 rounded-full border border-zinc-300/80 bg-zinc-950/50 px-1.5 py-1 backdrop-blur-sm md:flex"
      [class.site-nav--scroll-expanded]="navScrollExpanded()"
      [attr.aria-label]="localeService.t('nav.mainAria')"
      (mouseleave)="onDesktopNavLeave()"
    >
      <span
        class="site-nav__indicator"
        [class.site-nav__indicator--active]="desktopIndicatorActive()"
        [class.site-nav__indicator--sliding]="desktopIndicatorSliding()"
        [style.left.px]="desktopIndicator().left"
        [style.top.px]="desktopIndicator().top"
        [style.width.px]="desktopIndicator().width"
        [style.height.px]="desktopIndicator().height"
        aria-hidden="true"
      ></span>

      @for (item of navItems; track item.id) {
        <a
          [href]="item.href"
          class="site-nav__link"
          (mouseenter)="onDesktopNavEnter($event)"
        >
          {{ localeService.t(item.labelKey) }}
        </a>
      }
    </nav>

    <button
      type="button"
      class="mobile-menu-btn inline-flex items-center justify-center border border-zinc-300/80 bg-zinc-950/50 text-sm font-medium text-zinc-200 backdrop-blur-sm transition-colors hover:border-white hover:text-white focus:outline-none focus-visible:ring-2 focus-visible:ring-white/50 md:hidden"
      [attr.aria-expanded]="mobileMenuOpen()"
      [attr.aria-label]="mobileMenuOpen() ? localeService.t('nav.menuClose') : localeService.t('nav.menuOpen')"
      (click)="toggleMobileMenu()"
    >
      @if (mobileMenuPresent()) {
        <app-icon name="x" />
      } @else {
        <app-icon name="menu" />
      }
    </button>

    <div class="locale-switch">
      <div
        class="relative inline-grid grid-cols-2 rounded-full border border-zinc-300/80 bg-zinc-950/50 p-0.5 backdrop-blur-sm"
        role="group"
        [attr.aria-label]="localeService.t('locale.groupAria')"
      >
        <span
          aria-hidden="true"
          class="pointer-events-none absolute inset-y-0.5 left-0.5 w-[calc(50%-0.125rem)] rounded-full bg-zinc-100 shadow-sm transition-transform duration-300 ease-out motion-reduce:transition-none"
          [class.translate-x-0]="localeService.locale() === 'BR'"
          [class.translate-x-full]="localeService.locale() === 'EN'"
        ></span>
        <button
          type="button"
          [class]="localeButtonClass('BR')"
          [attr.aria-pressed]="localeService.locale() === 'BR'"
          [attr.aria-label]="localeService.t('locale.groupAria') + ' — BR'"
          (click)="selectLocale('BR')"
        >
          <img src="/flags/br.svg" alt="" class="locale-flag" width="16" height="12" />
          <span class="locale-switch__label">BR</span>
        </button>
        <button
          type="button"
          [class]="localeButtonClass('EN')"
          [attr.aria-pressed]="localeService.locale() === 'EN'"
          [attr.aria-label]="localeService.t('locale.groupAria') + ' — EN'"
          (click)="selectLocale('EN')"
        >
          <img src="/flags/us.svg" alt="" class="locale-flag" width="16" height="12" />
          <span class="locale-switch__label">EN</span>
        </button>
      </div>
    </div>
  </div>

  <div class="site-header__offset md:hidden" aria-hidden="true"></div>

  @if (mobileMenuPresent()) {
    <div
      class="mobile-menu-layer md:hidden"
      [class.mobile-menu-layer--open]="mobileMenuOpen()"
    >
      <div
        class="mobile-menu-backdrop"
        aria-hidden="true"
        (click)="closeMobileMenu()"
      ></div>

      <nav
        class="mobile-menu"
        [attr.aria-label]="localeService.t('nav.mainAria')"
        (mouseleave)="onMobileNavLeave()"
      >
        <span
          class="mobile-menu__indicator"
          [class.mobile-menu__indicator--active]="mobileIndicatorActive()"
          [class.mobile-menu__indicator--sliding]="mobileIndicatorSliding()"
          [style.left.px]="mobileIndicator().left"
          [style.top.px]="mobileIndicator().top"
          [style.width.px]="mobileIndicator().width"
          [style.height.px]="mobileIndicator().height"
          aria-hidden="true"
        ></span>

        @for (item of navItems; track item.id) {
          <a
            [href]="item.href"
            class="mobile-menu__link"
            (mouseenter)="onMobileNavEnter($event)"
            (click)="closeMobileMenu()"
          >
            {{ localeService.t(item.labelKey) }}
          </a>
        }
      </nav>
    </div>
  }
</header>
