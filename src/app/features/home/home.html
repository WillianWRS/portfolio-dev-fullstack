<main
  class="relative min-h-dvh overflow-x-hidden bg-zinc-950 text-zinc-100 bg-live"
  (click)="onMainClick()"
>
  <a class="skip-link" href="#main-content">{{ localeService.t('skipToContent') }}</a>

  <app-background-effects #backgroundEffects effect="stars" />

  <app-site-header />

  <div id="main-content" class="relative z-10">
    <section id="profile" class="profile-zone scroll-mt-28">
      <div class="profile-zone__wall" aria-hidden="true"></div>
      <div class="profile-zone__content mx-auto w-[70%] px-6 py-20 md:px-8 md:py-28">
        <app-profile />
      </div>
    </section>

    <div class="mx-auto w-[70%] px-6 md:px-8">
      <app-about />
      <app-experience />
      <app-projects />
      <app-stacks />
      <app-testimonials />
      <app-contact />
      <app-site-footer />
    </div>
  </div>
</main>
