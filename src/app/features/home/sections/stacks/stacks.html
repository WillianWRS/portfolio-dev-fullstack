<section id="stacks" class="section-reveal mt-28 md:mt-36 scroll-mt-28">
  <div class="section-card">
    <h2 class="section-card__heading">
      <app-icon name="settings" />
      {{ localeService.t('stacks.heading') }}
    </h2>
    <p class="section-card__subtitle">{{ localeService.t('stacks.subtitle') }}</p>

    <div class="mt-14 grid gap-12 sm:grid-cols-2">
      @for (category of content.stackCategories(); track category.id) {
        <div class="min-w-0">
          <h3 class="text-sm font-semibold uppercase tracking-wider text-zinc-500">
            {{ category.label }}
          </h3>
          <ul class="mt-5 flex flex-wrap gap-2.5" [attr.aria-label]="category.label">
            @for (item of category.items; track item.name) {
              <li>
                <app-stack-chip
                  [name]="item.name"
                  [iconSlug]="item.iconSlug"
                  [proficiency]="item.proficiency"
                  [proficiencyLabel]="item.proficiencyLabel"
                />
              </li>
            }
          </ul>
        </div>
      }
    </div>
  </div>
</section>
