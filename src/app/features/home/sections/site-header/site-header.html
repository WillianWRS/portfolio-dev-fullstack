<a
  routerLink="/"
  class="font-display fixed top-6 left-6 z-20 rounded-full border border-zinc-300/80 bg-transparent px-4 py-2 text-sm font-semibold tracking-widest text-zinc-200 backdrop-blur-sm transition-colors hover:border-white hover:text-white focus:outline-none focus-visible:ring-2 focus-visible:ring-white/50 focus-visible:ring-offset-2 focus-visible:ring-offset-zinc-950"
  aria-label="WRS — início"
>
  WRS
</a>

<nav
  class="site-nav fixed top-6 left-1/2 z-20 hidden -translate-x-1/2 items-center gap-1 rounded-full border border-zinc-300/80 bg-zinc-950/50 px-1.5 py-1 backdrop-blur-sm lg:flex"
  [attr.aria-label]="localeService.t('nav.mainAria')"
  (mouseleave)="onDesktopNavLeave()"
>
  <span
    class="site-nav__indicator"
    [class.site-nav__indicator--active]="desktopIndicatorActive()"
    [class.site-nav__indicator--sliding]="desktopIndicatorSliding()"
    [style.left.px]="desktopIndicator().left"
    [style.top.px]="desktopIndicator().top"
    [style.width.px]="desktopIndicator().width"
    [style.height.px]="desktopIndicator().height"
    aria-hidden="true"
  ></span>

  @for (item of navItems; track item.id) {
    <a
      [href]="item.href"
      class="site-nav__link"
      (mouseenter)="onDesktopNavEnter($event)"
    >
      {{ localeService.t(item.labelKey) }}
    </a>
  }
</nav>

<div class="fixed top-6 right-6 z-20">
  <div
    class="relative inline-grid grid-cols-2 rounded-full border border-zinc-300/80 bg-zinc-950/50 p-0.5 backdrop-blur-sm"
    role="group"
    [attr.aria-label]="localeService.t('locale.groupAria')"
  >
    <span
      aria-hidden="true"
      class="pointer-events-none absolute inset-y-0.5 left-0.5 w-[calc(50%-0.125rem)] rounded-full bg-zinc-100 shadow-sm transition-transform duration-300 ease-out motion-reduce:transition-none"
      [class.translate-x-0]="localeService.locale() === 'BR'"
      [class.translate-x-full]="localeService.locale() === 'EN'"
    ></span>
    <button
      type="button"
      [class]="localeButtonClass('BR')"
      [attr.aria-pressed]="localeService.locale() === 'BR'"
      (click)="selectLocale('BR')"
    >
      <img src="/flags/br.svg" alt="" class="locale-flag" width="16" height="12" />
      BR
    </button>
    <button
      type="button"
      [class]="localeButtonClass('EN')"
      [attr.aria-pressed]="localeService.locale() === 'EN'"
      (click)="selectLocale('EN')"
    >
      <img src="/flags/us.svg" alt="" class="locale-flag" width="16" height="12" />
      EN
    </button>
  </div>
</div>

<button
  type="button"
  class="mobile-menu-btn fixed top-6 left-1/2 z-20 inline-flex -translate-x-1/2 items-center gap-2 rounded-full border border-zinc-300/80 bg-zinc-950/50 px-4 py-2 text-sm font-medium text-zinc-200 backdrop-blur-sm transition-colors hover:border-white hover:text-white focus:outline-none focus-visible:ring-2 focus-visible:ring-white/50 lg:hidden"
  [attr.aria-expanded]="mobileMenuOpen()"
  [attr.aria-label]="localeService.t('nav.menuAria')"
  (click)="toggleMobileMenu()"
>
  @if (mobileMenuOpen()) {
    <app-icon name="x" />
    {{ localeService.t('nav.menuClose') }}
  } @else {
    <app-icon name="menu" />
    {{ localeService.t('nav.menuOpen') }}
  }
</button>

@if (mobileMenuOpen()) {
  <div
    class="mobile-menu-backdrop fixed inset-0 z-[19] bg-black/50 backdrop-blur-sm lg:hidden"
    aria-hidden="true"
    (click)="closeMobileMenu()"
  ></div>

  <nav
    class="mobile-menu fixed left-1/2 top-20 z-20 w-[min(92vw,20rem)] -translate-x-1/2 rounded-2xl border border-zinc-300/80 bg-zinc-950/95 p-2 backdrop-blur-md lg:hidden"
    [attr.aria-label]="localeService.t('nav.mainAria')"
    (mouseleave)="onMobileNavLeave()"
  >
    <span
      class="mobile-menu__indicator"
      [class.mobile-menu__indicator--active]="mobileIndicatorActive()"
      [class.mobile-menu__indicator--sliding]="mobileIndicatorSliding()"
      [style.left.px]="mobileIndicator().left"
      [style.top.px]="mobileIndicator().top"
      [style.width.px]="mobileIndicator().width"
      [style.height.px]="mobileIndicator().height"
      aria-hidden="true"
    ></span>

    @for (item of navItems; track item.id) {
      <a
        [href]="item.href"
        class="mobile-menu__link"
        (mouseenter)="onMobileNavEnter($event)"
        (click)="closeMobileMenu()"
      >
        {{ localeService.t(item.labelKey) }}
      </a>
    }
  </nav>
}
