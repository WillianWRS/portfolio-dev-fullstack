<span
  [class]="chipClass()"
  [class.stack-chip--text-only]="!hasIcon()"
  [attr.title]="proficiencyLabel() || null"
>
  @if (hasIcon()) {
    <img
      [src]="iconUrl()"
      alt=""
      [class]="iconClass()"
      width="24"
      height="24"
      loading="lazy"
      (error)="onIconError($event)"
    />
  }
  <span>{{ name() }}</span>
  @if (proficiencyLabel()) {
    <span
      class="stack-chip__badge rounded-full px-2 py-0.5 text-[11px] font-semibold uppercase tracking-wide"
      [class]="proficiencyClass()"
    >
      {{ proficiencyShort() }}
    </span>
  }
</span>
