<section class="mt-28 md:mt-36">
  <div class="rounded-3xl bg-zinc-50 px-6 py-16 text-zinc-900 ring-1 ring-zinc-200/70 md:px-10">
    <h2 class="flex items-center gap-2.5 text-xl font-medium tracking-tight text-zinc-900">
      <app-icon name="settings" />
      {{ localeService.t('stacks.heading') }}
    </h2>
    <p class="mt-3 text-base text-zinc-600">
      {{ localeService.t('stacks.subtitle') }}
    </p>

    <div class="mt-14 grid gap-12 sm:grid-cols-2">
      @for (category of content.stackCategories(); track category.id) {
        <div class="min-w-0">
          <h3 class="text-sm font-semibold uppercase tracking-wider text-zinc-500">
            {{ category.label }}
          </h3>
          <ul class="mt-5 flex flex-wrap gap-2.5" [attr.aria-label]="category.label">
            @for (item of category.items; track item.name) {
              <li>
                <app-stack-chip [name]="item.name" [iconSlug]="item.iconSlug" />
              </li>
            }
          </ul>
        </div>
      }
    </div>
  </div>
</section>
