<main
  class="relative min-h-dvh overflow-hidden bg-zinc-950 text-zinc-100 bg-live"
  (click)="onMainClick()"
>
  <app-background-effects #backgroundEffects [effect]="selectedEffect()" />

  <app-site-header
    [selectedEffect]="selectedEffect()"
    [effectsMenuOpen]="effectsMenuOpen()"
    (effectsMenuToggle)="toggleEffectsMenu()"
    (effectSelect)="selectEffect($event)"
  />

  <div class="relative z-10">
    <section class="profile-zone">
      <div class="profile-zone__wall" aria-hidden="true"></div>
      <div class="profile-zone__content mx-auto w-[70%] px-6 py-20 md:px-8 md:py-28">
        <app-profile />
      </div>
    </section>

    <div class="mx-auto w-[70%] px-6 md:px-8">
      <app-projects />

      <app-stacks />

      <footer class="mt-28 border-t border-zinc-900 pt-10 text-sm text-zinc-600">
        <p>{{ localeService.t('footer.text') }}</p>
      </footer>
    </div>
  </div>
</main>
